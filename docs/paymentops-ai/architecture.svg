<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="1" stop-color="#10152d"/>
  </linearGradient>
  <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#24154d"/>
    <stop offset="1" stop-color="#3b1d70"/>
  </linearGradient>
  <linearGradient id="ops" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10352f"/>
    <stop offset="1" stop-color="#155e52"/>
  </linearGradient>
  <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#102c46"/>
    <stop offset="1" stop-color="#164e70"/>
  </linearGradient>
  <filter id="shadow">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".35"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#67e8f9"/>
  </marker>
</defs>

<rect width="1600" height="1000" fill="url(#bg)"/>

